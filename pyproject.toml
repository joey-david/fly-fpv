[project]
name = "flypv"
version = "0.1.0"
description = "Reinforcement learning on the Drosophila maleCNS connectome: teach a real fly brain to fly a 3D drone-racing course."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.4",
    "pandas>=2.2",
    "pyarrow>=16",
    "gymnasium>=0.29",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pyyaml>=6",
    "tqdm>=4.66",
    "rich>=13",
]

[project.optional-dependencies]
# Anatomically detailed MuJoCo fly body (DeepMind x Janelia). Heavier install.
body = ["mujoco>=3.2", "dm-control>=1.0.20"]

[project.scripts]
flypv = "flypv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flypv"]
